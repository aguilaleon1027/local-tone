services:
  - type: web
    name: janggeum-hanbok
    runtime: python
    region: singapore  # 한국에서 가장 가까운 리전
    plan: free
    buildCommand: |
      cd frontend && npm install && npm run build && cd ..
      pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: HF_TOKEN
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: NOTIFICATION_EMAIL
        sync: false
      - key: KAKAO_REST_API_KEY
        sync: false
      - key: VITE_KAKAO_MAP_KEY
        sync: false
